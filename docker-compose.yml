services:
  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.155.0
    command:
      - -storageDataPath=/victoria-metrics-data  # VM's TSDB storage location
      - -retentionPeriod=31d
    ports:
      - "127.0.0.1:8428:8428"
    volumes:
      - victoria-metrics-data:/victoria-metrics-data  # See docker volume ls, docker volume inspect <volume_name>
    restart: unless-stopped

  renderer:
    image: grafana/grafana-image-renderer:latest
  
  grafana:
    image: grafana/grafana:12.0.0
    depends_on:
      - victoria-metrics
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
    restart: unless-stopped

volumes:
  victoria-metrics-data:
  grafana-data:
