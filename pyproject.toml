dependencies = [
    "catkin-pkg>=1.1.1",
    "empy>=3.3.4,<4",
    "ipython>=9.17.1",
    "lark>=1.3.1",
    "marimo>=0.25.0",
    "matplotlib>=3.11.2",
    "onnx>=1.12.0,<2.0.0",
    "onnxruntime>=1.30.0",
    "onnxslim>=0.1.82",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "rerun-sdk[catalog]>=0.40.0",
