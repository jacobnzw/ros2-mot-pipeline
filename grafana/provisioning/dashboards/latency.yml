# Tell Grafana to load dashboard JSON files from /var/lib/grafana/dashboards 
# and place them in the ROS 2 analysis folder. The path is within the Grafana docker container.
apiVersion: 1

providers:
  - name: ROS 2 latency
    orgId: 1
    folder: ROS 2 analysis
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
