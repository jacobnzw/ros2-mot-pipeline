apiVersion: 1

# When you open the dashboard, Grafana sends the panel queries to the data source URL. 
# For example, the heatmap queries pipeline_kpi for the selected config and detector_inference_ms name.
# That query is the VM-to-Grafana handoff—Grafana reads the results and draws the panels.
datasources:
  - name: VictoriaMetrics
    uid: victoriametrics
    type: prometheus
    access: proxy
    url: http://victoria-metrics:8428
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 100ms
